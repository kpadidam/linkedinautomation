<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hacker terminal favicon: phosphor-green ">_" prompt on black -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="10" fill="#0a0a0a"/>
  <g filter="url(#glow)" stroke="#00ff41" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 18 22 L 32 32 L 18 42" stroke-width="5" fill="none"/>
    <rect x="34" y="42" width="14" height="4.5" rx="1" fill="#00ff41" stroke="none"/>
  </g>
</svg>
